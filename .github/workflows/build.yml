name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build Release APK
        run: ./gradlew assembleRelease
      - name: Sign APK
        run: |
          keytool -genkey -v -keystore key.jks -alias dajiraj -keyalg RSA -keysize 2048 -validity 10000 -storepass dajiraj123 -keypass dajiraj123 -dname "CN=Dajiraj,O=Family,C=IN" -noprompt
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner sign --ks key.jks --ks-pass pass:dajiraj123 --key-pass pass:dajiraj123 --out app/build/outputs/apk/release/ScreenTime.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTime-APK
          path: app/build/outputs/apk/release/ScreenTime.apk
          retention-days: 90
